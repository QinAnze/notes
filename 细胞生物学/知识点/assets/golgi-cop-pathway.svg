<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>分泌途径：蛋白合成、COPII/COPI 运输与高尔基体加工</title>
<desc>分泌蛋白在核糖体上合成后经 SRP 导向粗面 ER，共翻译转位进入 ER 腔并由 BiP 折叠，随后由 COPII 囊泡顺向运往高尔基体，经各层修饰分选后投递到质膜或溶酶体，逃逸的 ER 蛋白由 COPI 逆行回收。</desc>
<style>
  text { font-family: var(--font-sans, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif); }
  .ttl { font-size: 14px; font-weight: 500; fill: var(--color-text-primary, #1a1a1a); }
  .lbl { font-size: 12px; fill: var(--color-text-secondary, #5c5c5c); }
  .sm  { font-size: 11px; }
  .hint{ font-size: 12px; fill: var(--color-text-tertiary, #8a8a8a); }
  .frame { fill: none; stroke: var(--color-border-tertiary, rgba(128,128,128,0.25)); stroke-width: 0.5; }
</style>

<defs>
  <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#185FA5"/>
  </marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#B3261E"/>
  </marker>
</defs>

<text class="ttl" x="40" y="24">分泌途径流水线　合成 → 运输 → 加工分选</text>
<text class="hint" x="300" y="24">合成只在核糖体　COPII 出厂　COPI 退货　高尔基体贴标签</text>

<!-- 核糖体 -->
<rect x="40" y="54" width="120" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ttl" x="56" y="78" fill="#042C53">核糖体</text>
<text class="sm" x="56" y="98" fill="#0C447C">蛋白合成（翻译）</text>

<!-- RER -->
<rect x="40" y="150" width="120" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ttl" x="56" y="174" fill="#04342C">粗面 ER</text>
<text class="sm" x="56" y="194" fill="#085041">共翻译转位 + 折叠</text>

<!-- COPII -->
<rect x="186" y="150" width="96" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ttl" x="202" y="174" fill="#042C53">COPII</text>
<text class="sm" x="202" y="194" fill="#0C447C">Sar1 启动</text>

<!-- Golgi -->
<rect x="320" y="150" width="240" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="ttl" x="336" y="174" fill="#412402">高尔基体</text>
<text class="sm" x="336" y="194" fill="#633806">cis → medial → trans　加工分选</text>

<!-- TGN split -->
<path d="M320 206 L240 250 L360 250" fill="none" stroke="#854F0B" stroke-width="1" marker-end="url(#f)"/>
<path d="M360 206 L420 250 L500 250" fill="none" stroke="#854F0B" stroke-width="1" marker-end="url(#f)"/>

<rect x="196" y="250" width="80" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="sm" x="236" y="274" fill="#04342C" text-anchor="middle">质膜</text>
<rect x="420" y="250" width="80" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="sm" x="460" y="274" fill="#04342C" text-anchor="middle">溶酶体</text>

<!-- 箭头 合成→ER -->
<line x1="100" y1="110" x2="100" y2="150" stroke="#185FA5" stroke-width="1.4" marker-end="url(#f)"/>
<text class="sm" x="110" y="136" fill="#0C447C">SRP 导向</text>

<!-- ER→COPII -->
<line x1="160" y1="178" x2="186" y2="178" stroke="#185FA5" stroke-width="1.4" marker-end="url(#f)"/>
<!-- COPII→Golgi -->
<line x1="282" y1="178" x2="320" y2="178" stroke="#185FA5" stroke-width="1.4" marker-end="url(#f)"/>
<text class="sm" x="296" y="170" fill="#0C447C" text-anchor="middle">顺向</text>

<!-- COPI 逆行 -->
<path d="M320 206 L280 230 L240 230" fill="none" stroke="#B3261E" stroke-width="1.2" marker-end="url(#r)"/>
<text class="sm" x="270" y="224" fill="#8C1D18">COPI 逆行</text>
<path d="M96 206 L120 230 L160 230" fill="none" stroke="#B3261E" stroke-width="1.2" marker-end="url(#r)"/>
<text class="sm" x="128" y="224" fill="#8C1D18">KDEL 回收</text>

<!-- 底栏：与合成的关系 -->
<rect class="frame" x="40" y="312" width="600" height="110" rx="10"/>
<text class="ttl" x="60" y="334" fill="#1a1a1a">与蛋白合成的关系</text>

<rect x="60" y="346" width="270" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="sm" x="76" y="366" fill="#042C53">① 合成　只发生在核糖体</text>
<text class="sm" x="76" y="384" fill="#0C447C">分泌蛋白带信号肽 → 边合成边转入 ER</text>
<text class="sm" x="76" y="402" fill="#0C447C">之后不再"合成"而是"搬运+修饰"</text>

<rect x="350" y="346" width="270" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="sm" x="366" y="366" fill="#412402">② 运输与加工　靠囊泡与酶</text>
<text class="sm" x="366" y="384" fill="#633806">COPII 出厂 / COPI 回收 / 高尔基体贴标签</text>
<text class="sm" x="366" y="402" fill="#633806">缺囊泡 → 新蛋白堆在 ER 出不去</text>

<text class="hint" x="40" y="446">被膜管方向（COPI/COPII 识别 source 信号），Rab+SNARE 管对接融合——二者缺一不可</text>
</svg>
