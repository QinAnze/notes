<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>成斑与成帽现象的机制对比</title>
<desc>成斑由多价抗体交联后膜面积守恒驱动，被动聚集于膜平面内，不耗能；成帽依赖肌动蛋白微丝与肌球蛋白主动运输，耗ATP汇聚于一极并被切除。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: var(--font-sans, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif); }
  .ttl  { font-size: 14px; font-weight: 500; fill: var(--color-text-primary, #1a1a1a); }
  .lbl  { font-size: 12px; fill: var(--color-text-secondary, #5c5c5c); }
  .hint { font-size: 12px; fill: var(--color-text-tertiary, #8a8a8a); }
  .bod  { font-size: 13px; fill: var(--color-text-primary, #1a1a1a); }
  .frame{ fill: none; stroke: var(--color-border-tertiary, rgba(128,128,128,0.25)); stroke-width: 0.5; }
  .lead { fill: none; stroke: var(--color-text-tertiary, #8a8a8a); stroke-width: 1; }
</style>

<rect class="frame" x="40" y="48" width="285" height="256" rx="12"/>
<text class="ttl" x="60" y="72">成斑　patching</text>
<text class="lbl" x="60" y="92">被动热力学过程</text>

<text class="hint" x="60" y="118">0 min　多价抗体交联</text>
<rect x="60" y="128" width="245" height="30" rx="6" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<circle cx="78" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="104" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="130" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="156" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="182" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="208" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="234" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="260" cy="143" r="3" fill="#B5D4F4"/>
<circle cx="286" cy="143" r="3" fill="#B5D4F4"/>

<path class="lead" d="M182 162 L182 172" marker-end="url(#arrow)"/>

<text class="hint" x="60" y="192">数分钟　小斑合并</text>
<rect x="60" y="202" width="245" height="30" rx="6" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<ellipse cx="100" cy="217" rx="15" ry="7" fill="#B5D4F4"/>
<ellipse cx="160" cy="217" rx="19" ry="8" fill="#B5D4F4"/>
<ellipse cx="228" cy="217" rx="16" ry="7" fill="#B5D4F4"/>
<circle cx="272" cy="217" r="5" fill="#85B7EB"/>

<text class="bod" x="60" y="256">膜面积守恒</text>
<text class="lbl" x="60" y="276">交联簇变大抢走膜</text>
<text class="lbl" x="60" y="294">簇合并以最小化界面</text>

<rect class="frame" x="355" y="48" width="285" height="256" rx="12"/>
<text class="ttl" x="375" y="72">成帽　capping</text>
<text class="lbl" x="375" y="92">细胞骨架主动运输</text>

<text class="hint" x="375" y="118">大斑沿微丝运向一极</text>
<rect x="375" y="128" width="245" height="30" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<ellipse cx="420" cy="143" rx="14" ry="6" fill="#9FE1CB"/>
<ellipse cx="500" cy="143" rx="13" ry="6" fill="#9FE1CB"/>
<ellipse cx="580" cy="143" rx="15" ry="7" fill="#9FE1CB"/>

<path d="M470 138 L524 138" stroke="#5DCAA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<path d="M470 149 L524 149" stroke="#5DCAA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<text class="hint" x="375" y="192">汇聚成帽并被切除</text>
<rect x="375" y="202" width="245" height="30" rx="6" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<path d="M375 217 Q400 202 425 217 Q450 232 475 217 L475 202 L375 202 Z" fill="#9FE1CB"/>

<text class="bod" x="375" y="256">微丝 treadmill 传送带</text>
<text class="lbl" x="375" y="276">肌动蛋白加肌球蛋白 II</text>
<text class="lbl" x="375" y="294">耗 ATP，被松弛素 D 阻断</text>

<rect class="frame" x="40" y="322" width="600" height="56" rx="12"/>
<text class="ttl" x="60" y="344">关键判别实验</text>
<text class="lbl" x="60" y="366">哺乳动物成熟红细胞：无核、无细胞骨架　→　能成斑，不能成帽</text>
</svg>