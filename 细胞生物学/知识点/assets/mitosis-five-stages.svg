<line x1="604" y1="106" x2="604" y2="118" stroke="#B3261E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
<line x1="616" y1="106" x2="616" y2="118" stroke="#B3261E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
<circle cx="588" cy="112" r="3" fill="#854F0B"/>
<text class="sm" x="588" y="170" fill="#042C53" text-anchor="middle">中体脱离</text>
<text class="ttl" x="544" y="192" fill="#042C53">末期</text>
<text class="sm" x="544" y="210" fill="#0C447C">去凝缩　核膜重建</text>
<text class="sm" x="544" y="226" fill="#0C447C">CDK1 活性骤降</text>
<text class="sm" x="544" y="242" fill="#0C447C">收缩环 → 分裂沟</text>
<text class="sm" x="544" y="256" fill="#0C447C">APC/C^Cdh1 接管</text>

<!-- 底部 -->
<rect class="frame" x="40" y="276" width="600" height="120" rx="9"/>
<text class="ttl" x="56" y="298">时长分配（哺乳动物培养细胞，参考值）</text>

<rect x="56" y="308" width="104" height="16" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="sm" x="108" y="320" fill="#042C53" text-anchor="middle">15–20 min</text>
<rect x="166" y="308" width="104" height="16" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="sm" x="218" y="320" fill="#412402" text-anchor="middle">10–15 min</text>
<rect x="276" y="308" width="104" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="sm" x="328" y="320" fill="#04342C" text-anchor="middle">10–20 min</text>
<rect x="386" y="308" width="104" height="16" rx="4" fill="#FBE9E7" stroke="#B3261E" stroke-width="0.5"/>
<text class="sm" x="438" y="320" fill="#8C1D18" text-anchor="middle">约 5 min</text>
<rect x="496" y="308" width="128" height="16" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="sm" x="560" y="320" fill="#042C53" text-anchor="middle">20–30 min</text>

<text class="sm" x="56" y="346" fill="#5c5c5a">前期　凝缩　／　前中期　核膜解体与捕获　／　中期　排列（变异最大，由 SAC 何时满足决定）</text>
<text class="sm" x="56" y="364" fill="#5c5c5a">后期　分离（相对恒定）　／　末期与胞质分裂　重建与脱离　／　全程约 1 h</text>
<text class="sm" x="56" y="386" fill="#412402">★ 方向性　进入 M 期靠可逆的 Cdc25 去磷酸化　退出靠不可逆的 cyclin B 泛素化降解</text>

<text class="hint" x="40" y="412">胞质分裂始于后期末、与末期重叠，并非末期的一部分；植物用成膜体与细胞板，无收缩环</text>
</svg>
